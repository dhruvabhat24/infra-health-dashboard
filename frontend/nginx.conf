server {
  listen 80;
  server_name _;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"frontend"}';
  }

  location /api/ {
    proxy_pass http://metrics-api:5001/;
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
